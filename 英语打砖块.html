<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学英语打砖块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --cyan: #00f0ff;
    --magenta: #ff00aa;
    --warm: #e8e8f0;
    --dim: #505070;
    --gold: #ffd700;
  }

  body {
    background: var(--bg);
    color: var(--warm);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Courier New', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 8px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 700px;
    padding: 4px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 8px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: clamp(14px, 3.5vw, 16px);
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .stats {
    display: flex;
    gap: 12px;
    font-size: 12px;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat-label {
    color: var(--dim);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-value {
    color: var(--warm);
    font-weight: 700;
    font-size: 13px;
    min-width: 20px;
    text-align: right;
  }

  .stat-value.lives {
    color: var(--magenta);
    text-shadow: 0 0 12px rgba(255, 0, 170, 0.5);
  }

  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    border: 1px solid rgba(0, 240, 255, 0.15);
    border-radius: 4px;
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.05),
      inset 0 0 30px rgba(0, 240, 255, 0.03);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    background: #0d0d20;
    border-radius: 4px;
    touch-action: none;
    vertical-align: bottom;
  }

  /* 竖屏时提示横屏 */
  .rotate-hint {
    display: none;
    position: fixed; inset: 0; background: var(--bg); z-index: 9999;
    align-items: center; justify-content: center; flex-direction: column; gap: 20px; text-align: center;
  }
  .rotate-hint .icon { font-size: 60px; }
  .rotate-hint .text { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 20px; color: var(--cyan); }
  .rotate-hint .sub { color: var(--dim); font-size: 14px; }
  @media (orientation: portrait) and (max-width: 500px) {
    .rotate-hint { display: flex !important; }
  }

  /* 单词栏 - 独立在外，不挡画布 */
  .word-bar {
    width: 100%;
    max-width: 700px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    margin-top: 4px;
    background: rgba(0,240,255,0.08);
    border: 1px solid rgba(0,240,255,0.15);
    border-radius: 6px;
    gap: 10px;
    min-height: 44px;
  }

  .word-display { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }

  .word-text-group { display: none; flex-direction: column; align-items: flex-start; gap: 1px; }
  .word-text-group.show { display: flex; }

  .word-en {
    font-family: 'Courier New', monospace;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }

  .word-cn {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: clamp(13px, 3vw, 15px);
    color: var(--warm);
    font-weight: 400;
  }

  .listen-btn {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 18px;
    border: 2px solid #00e5ff;
    background: rgba(0,229,255,0.12);
    color: #00e5ff;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    display: none;
    white-space: nowrap;
  }
  .listen-btn.show { display: inline-block; }
  .listen-btn:active { background: #00e5ff; color: #000; }

  .controls-hint {
    display: flex;
    gap: 12px;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.5px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls-hint kbd {
    font-family: 'Courier New', monospace;
    color: var(--warm);
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 26, 0.88);
    border-radius: 4px;
    gap: 12px;
    transition: opacity 0.4s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
    letter-spacing: 3px;
    text-align: center;
    line-height: 1.4;
    padding: 0 16px;
  }

  .overlay-title.game-over { color: var(--magenta); text-shadow: 0 0 40px rgba(255, 0, 170, 0.5); }
  .overlay-title.win { color: var(--gold); text-shadow: 0 0 40px rgba(255, 215, 0, 0.5); }

  .overlay-sub {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.8;
    max-width: 400px;
    padding: 0 16px;
  }

  .overlay-sub .highlight { color: var(--gold); }

  .overlay-score {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: var(--warm);
    margin-top: 4px;
    text-align: center;
  }

  .btn {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 32px;
    border: 2px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .btn:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 30px rgba(0, 240, 255, 0.3); }
  .btn:active { background: var(--cyan); color: var(--bg); }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
</style>
</head>
<body>

<!-- 竖屏提示 -->
<div class="rotate-hint" id="rotateHint">

</div>

<div class="game-wrapper">

      <div class="stat"><span class="stat-label">生命</span><span class="stat-value lives" id="livesDisplay">♥♥♥</span></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="700" height="525"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="overlay-title">📚 小学英语打砖块</div>

      </div>
      <button class="btn" id="startBtn">开始学习</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="overlay-title game-over">游戏结束</div>
      <div class="overlay-score" id="finalScore">0</div>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>

    <div class="overlay hidden" id="winOverlay">

      <div class="overlay-score" id="winScore">0</div>
      <button class="btn" id="nextBtn">下一关</button>

  </div>

  <!-- 单词栏 - 独立在画布外面 -->
  <div class="word-bar">

      <div class="word-text-group" id="wordGroup">
        <span class="word-en" id="wordEn">cat</span>

    </div>
    <button class="listen-btn" id="listenBtn">🔊 再听一次</button>

  <div class="controls-hint">
    <span>💻 <kbd>← →</kbd> 移动 <kbd>空格</kbd> 发射</span>
    <span>📱 <span>滑动移动 · 点击发射</span></span>
  </div>
</div>

  var MELODY = [0,2,4,3, 0,2,4,3, 1,3,4,2, 0,2,4,4, 4,3,2,0, 4,3,2,1, 3,2,0,1, 0,0,2,4, 0,2,4,3, 0,2,4,3, 1,3,4,2, 0,2,4,4, 4,3,2,0, 4,3,2,1, 3,2,0,1, 0,0,4,2];
  var melodyIdx = 0;

  function playNote(freq, duration) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var env = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      env.gain.setValueAtTime(0, audioCtx.currentTime);
      env.gain.linearRampToValueAtTime(0.10, audioCtx.currentTime + 0.02);
      env.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + duration * 0.3);
      env.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
      osc.connect(env);
      env.connect(musicGain);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function scheduleNextNote() {
    if (!bgMusicPlaying || !audioCtx) return;
    var note = SCALE[MELODY[melodyIdx % MELODY.length]];
    playNote(note, 0.18);
    melodyIdx++;
    musicTimeout = setTimeout(scheduleNextNote, 126);
  }

  function startBgMusic() {
    if (bgMusicPlaying) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!musicGain) { musicGain = audioCtx.createGain(); musicGain.gain.value = 0.06; musicGain.connect(audioCtx.destination); }
      bgMusicPlaying = true; melodyIdx = 0;
      scheduleNextNote();
    } catch(e) {}
  }

  function stopBgMusic() { bgMusicPlaying = false; if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout = null; } }

  function startGameMusic() { stopBgMusic(); setTimeout(startBgMusic, 150); }

  var englishVoice = null;
  function getEnglishVoice() {
    if (englishVoice) return englishVoice;
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices();
    // 优先找原生英语语音
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      if (v.lang === 'en-US' && v.localService && v.name.indexOf('Zira') >= 0) { englishVoice = v; break; }
      if (v.lang === 'en-US' && v.localService && !englishVoice) englishVoice = v;
      if (v.lang.startsWith('en-') && v.localService && !englishVoice) englishVoice = v;
      if (v.lang.startsWith('en-') && !englishVoice) englishVoice = v;
    }
    return englishVoice;
  }
  // 预加载语音列表（异步）
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() { getEnglishVoice(); };
  }

  function speakWord(word) {
    if (!window.speechSynthesis || !word) return;
    try {
      // 先取消之前没读完的，避免重叠颤抖
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(word));
      var voice = getEnglishVoice();
      if (voice) u.voice = voice;
      u.lang = 'en-US';
      u.rate = 0.75;
      u.pitch = 1.0;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  var floatingTexts = [];
  function addFloatingText(x, y, text) { floatingTexts.push({ x: x, y: y, text: text, life: 1.0, vy: -2 }); }

  var score = 0, lives = 3, level = 1, gameRunning = false, paused = false;
  var paddle = { w: 100, h: 14, x: 0, y: H - 32, speed: 7 };
  paddle.x = (W - paddle.w) / 2;
  var ball = { x: 0, y: 0, r: 10, dx: 4, dy: -4, speed: 4.5, stuck: true };
  var trail = [];
  var BRICK_COLS = 10, BRICK_ROWS = 5, BRICK_W = 62, BRICK_H = 32, BRICK_PAD = 6, BRICK_TOP = 50;
  var BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;
  var BRICK_COLORS = [['#ff0044','#cc0033'],['#ff6600','#cc5200'],['#ffcc00','#cca300'],['#44cc44','#339933'],['#00bbff','#0095cc'],['#ff00aa','#cc0088']];

  var bricks = [];

  function shuffleArray(arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; }
    return arr;
  }

  function createBricks() {
    bricks = [];
    var topic = VOCAB_TOPICS[(level - 1) % VOCAB_TOPICS.length];
    var wordPool = shuffleArray(topic.words.slice());
    for (var r = 0; r < BRICK_ROWS; r++) {
      for (var c = 0; c < BRICK_COLS; c++) {
        var w = wordPool[(r * BRICK_COLS + c) % wordPool.length];
        var colorIdx = r % BRICK_COLORS.length;
        var baseHp = w.en.length >= 7 ? 3 : (w.en.length >= 5 ? 2 : 1);
        bricks.push({ x: BRICK_LEFT + c*(BRICK_W+BRICK_PAD), y: BRICK_TOP + r*(BRICK_H+BRICK_PAD), w:BRICK_W, h:BRICK_H, hp:baseHp, maxHp:baseHp, color:BRICK_COLORS[colorIdx], en:w.en, zh:w.zh, alive:true });
      }
    }
  }

  function resetBall() { ball.stuck = true; ball.x = paddle.x+paddle.w/2; ball.y = paddle.y-ball.r; ball.dx=(Math.random()>0.5?1:-1)*ball.speed*0.6; ball.dy=-ball.speed; trail.length=0; }

  function initGame() { score=0;lives=3;level=1;createBricks();paddle.x=(W-paddle.w)/2;resetBall();floatingTexts=[];updateUI();hideWordDisplay(); }

  function updateUI() { scoreDisplay.textContent=String(score);levelDisplay.textContent=String(level);var h='';for(var i=0;i<Math.max(0,lives);i++)h+='♥';livesDisplay.textContent=h; }

  function showWord(en,zh) { wordEn.textContent=en;wordCn.textContent=zh;wordGroup.className='word-text-group show';listenBtn.className='listen-btn show';listenBtn.onclick=function(){speakWord(en);}; }

  function hideWordDisplay() { wordGroup.className='word-text-group';listenBtn.className='listen-btn'; }

  function drawBackground() { ctx.fillStyle='#0d0d20';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(0,240,255,0.015)';for(var y=0;y<H;y+=3)ctx.fillRect(0,y,W,1); }

  function drawPaddle() {
    var g=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);g.addColorStop(0,'#00f0ff');g.addColorStop(1,'#00b0cc');ctx.fillStyle=g;
    var pr=5;ctx.beginPath();ctx.moveTo(paddle.x+pr,paddle.y);ctx.lineTo(paddle.x+paddle.w-pr,paddle.y);ctx.quadraticCurveTo(paddle.x+paddle.w,paddle.y,paddle.x+paddle.w,paddle.y+pr);ctx.lineTo(paddle.x+paddle.w,paddle.y+paddle.h-pr);ctx.quadraticCurveTo(paddle.x+paddle.w,paddle.y+paddle.h,paddle.x+paddle.w-pr,paddle.y+paddle.h);ctx.lineTo(paddle.x+pr,paddle.y+paddle.h);ctx.quadraticCurveTo(paddle.x,paddle.y+paddle.h,paddle.x,paddle.y+paddle.h-pr);ctx.lineTo(paddle.x,paddle.y+pr);ctx.quadraticCurveTo(paddle.x,paddle.y,paddle.x+pr,paddle.y);ctx.closePath();ctx.fill();
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=15;ctx.strokeStyle='rgba(0,240,255,0.3)';ctx.lineWidth=1;ctx.stroke();ctx.shadowBlur=0;
  }

  function drawBall() {
    for(var i=0;i<trail.length;i++){var alpha=(i/trail.length)*0.25;var size=ball.r*(0.3+0.7*(i/trail.length));ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,size,0,Math.PI*2);ctx.fillStyle='rgba(0,240,255,'+alpha+')';ctx.fill();}
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=30;
    var g=ctx.createRadialGradient(ball.x-2,ball.y-3,0,ball.x,ball.y,ball.r);g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#aaf0ff');g.addColorStop(1,'#00aacc');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    var eyeOff=ball.r*0.32,eyeR=ball.r*0.2;
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ball.x-eyeOff,ball.y-1,eyeR+1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+eyeOff,ball.y-1,eyeR+1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(ball.x-eyeOff+1,ball.y,eyeR*0.65,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+eyeOff+1,ball.y,eyeR*0.65,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ball.x-eyeOff+2,ball.y-2,eyeR*0.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+eyeOff+2,ball.y-2,eyeR*0.3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#0a0a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ball.x,ball.y+1,ball.r*0.25,0.1,Math.PI-0.1);ctx.stroke();
    ctx.fillStyle='rgba(255,150,180,0.5)';ctx.beginPath();ctx.arc(ball.x-eyeOff-2,ball.y+3,eyeR*0.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(ball.x+eyeOff+2,ball.y+3,eyeR*0.7,0,Math.PI*2);ctx.fill();
  }

  function drawBricks() {
    for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
      var c1=b.color[0],c2=b.color[1];ctx.shadowColor=c1;ctx.shadowBlur=6;
      var g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;
      var br=2;ctx.beginPath();ctx.moveTo(b.x+br,b.y);ctx.lineTo(b.x+b.w-br,b.y);ctx.quadraticCurveTo(b.x+b.w,b.y,b.x+b.w,b.y+br);ctx.lineTo(b.x+b.w,b.y+b.h-br);ctx.quadraticCurveTo(b.x+b.w,b.y+b.h,b.x+b.w-br,b.y+b.h);ctx.lineTo(b.x+br,b.y+b.h);ctx.quadraticCurveTo(b.x,b.y+b.h,b.x,b.y+b.h-br);ctx.lineTo(b.x,b.y+br);ctx.quadraticCurveTo(b.x,b.y,b.x+br,b.y);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(b.x+3,b.y+2,b.w-6,2);
      ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(b.x+2,b.y+b.h/2-9,b.w-4,20);
      ctx.shadowColor='#000000';ctx.shadowBlur=10;ctx.fillStyle='#ffffff';ctx.textAlign='center';ctx.textBaseline='middle';
      var enSize=b.en.length<=3?18:(b.en.length<=5?16:(b.en.length<=7?13:11));
      ctx.font='bold '+enSize+'px "Courier New", monospace';ctx.fillText(b.en,b.x+b.w/2,b.y+b.h/2-5);ctx.shadowBlur=0;
      ctx.shadowColor='#000000';ctx.shadowBlur=5;ctx.fillStyle='#f0f0ff';
      var cnSize=b.zh.length>=3?12:14;
      ctx.font=cnSize+'px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.fillText(b.zh,b.x+b.w/2,b.y+b.h/2+12);ctx.shadowBlur=0;
      if(b.maxHp>1){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='7px monospace';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('x'+b.hp,b.x+b.w-2,b.y+2);}
    }
  }

  function drawFloatingTexts() {
    for(var i=floatingTexts.length-1;i>=0;i--){var ft=floatingTexts[i];ft.y+=ft.vy;ft.life-=0.025;if(ft.life<=0){floatingTexts.splice(i,1);continue;}ctx.globalAlpha=ft.life;ctx.fillStyle='#ffd700';ctx.font='bold 15px "Courier New", monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#ffd700';ctx.shadowBlur=15;ctx.fillText(ft.text,ft.x,ft.y);ctx.shadowBlur=0;ctx.globalAlpha=1.0;}
  }

  function drawPauseOverlay() { if(!paused)return;ctx.fillStyle='rgba(10,10,26,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#00f0ff';ctx.font='18px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('暂停',W/2,H/2-10);ctx.fillStyle='#505070';ctx.font='10px monospace';ctx.fillText('点击继续',W/2,H/2+20); }

  function updateBall() {
    if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;return;}
    if(paused||!gameRunning)return;
    trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();
    ball.x+=ball.dx;ball.y+=ball.dy;
    if(ball.x-ball.r<=0){ball.x=ball.r;ball.dx=-ball.dx;}
    if(ball.x+ball.r>=W){ball.x=W-ball.r;ball.dx=-ball.dx;}
    if(ball.y-ball.r<=0){ball.y=ball.r;ball.dy=-ball.dy;}
    if(ball.y+ball.r>H){lives--;updateUI();if(lives<=0){gameRunning=false;stopBgMusic();finalScore.textContent='最终得分: '+score;gameOverOverlay.classList.remove('hidden');return;}resetBall();return;}
    if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+5&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){
      var hit=(ball.x-paddle.x)/paddle.w;var angle=(hit-0.5)*1.2;var speed=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);ball.dx=Math.sin(angle)*speed;ball.dy=-Math.cos(angle)*speed;ball.y=paddle.y-ball.r;if(Math.abs(ball.dy)<speed*0.3)ball.dy=-speed*0.3;var spd=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(spd>7){ball.dx=(ball.dx/spd)*7;ball.dy=(ball.dy/spd)*7;}
    }
    for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;var bx=Math.max(b.x,Math.min(ball.x,b.x+b.w));var by=Math.max(b.y,Math.min(ball.y,b.y+b.h));var distX=ball.x-bx;var distY=ball.y-by;var dist=Math.sqrt(distX*distX+distY*distY);
      if(dist<ball.r){b.hp--;var destroyed=b.hp<=0;if(destroyed){b.alive=false;showWord(b.en,b.zh);speakWord(b.en);addFloatingText(b.x+b.w/2,b.y+b.h/2-4,b.en);score+=10*level;}else{score+=5;}updateUI();
        var overlapX=ball.r-Math.abs(distX);var overlapY=ball.r-Math.abs(distY);if(overlapX<overlapY){ball.dx=-ball.dx;ball.x+=(distX>0?overlapX:-overlapX);}else{ball.dy=-ball.dy;ball.y+=(distY>0?overlapY:-overlapY);}break;}
    }
    var allDead=true;for(var i=0;i<bricks.length;i++){if(bricks[i].alive){allDead=false;break;}}
    if(allDead){gameRunning=false;stopBgMusic();var tn=VOCAB_TOPICS[(level-1)%VOCAB_TOPICS.length].name;winScore.textContent='得分: '+score+' | 学了 '+(BRICK_COLS*BRICK_ROWS)+' 个'+tn+'单词!';winOverlay.classList.remove('hidden');}
    var cs=Math.sqrt(ball.dx*ball.dx+ball.dy*ball.dy);if(cs>7){ball.dx=(ball.dx/cs)*7;ball.dy=(ball.dy/cs)*7;}
  }

  function gameLoop(){drawBackground();drawBricks();drawPaddle();updateBall();drawBall();drawFloatingTexts();drawPauseOverlay();requestAnimationFrame(gameLoop);}

  canvas.addEventListener('touchstart',function(e){e.preventDefault();if(!gameRunning||_gameJustStarted)return;if(ball.stuck){ball.stuck=false;return;}paused=!paused;if(paused)stopBgMusic();else startBgMusic();},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();if(!gameRunning||paused)return;var rect=canvas.getBoundingClientRect();var scaleX=W/rect.width;var tx=(e.touches[0].clientX-rect.left)*scaleX;tx=Math.max(paddle.w/2,Math.min(W-paddle.w/2,tx));paddle.x=tx-paddle.w/2;if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;}},{passive:false});
  canvas.addEventListener('mousemove',function(e){if(!gameRunning||paused)return;var rect=canvas.getBoundingClientRect();var mx=(e.clientX-rect.left)*(W/rect.width);mx=Math.max(paddle.w/2,Math.min(W-paddle.w/2,mx));paddle.x=mx-paddle.w/2;if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;}});

  var keys={};
  document.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key===' '||e.key==='Space'){e.preventDefault();if(ball.stuck&&gameRunning){ball.stuck=false;}else if(gameRunning){paused=!paused;if(paused)stopBgMusic();else startBgMusic();}}});
  document.addEventListener('keyup',function(e){keys[e.key]=false;});
  function updatePaddle(){if(!gameRunning||paused)return;if(keys['ArrowLeft']||keys['a']||keys['A']){paddle.x=Math.max(0,paddle.x-paddle.speed);if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;}}if(keys['ArrowRight']||keys['d']||keys['D']){paddle.x=Math.min(W-paddle.w,paddle.x+paddle.speed);if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;}}}
  setInterval(updatePaddle,16);

  var _gameJustStarted = false;
  document.getElementById('startBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();startGameMusic();startOverlay.classList.add('hidden');gameRunning=true;ball.stuck=false;_gameJustStarted=true;setTimeout(function(){_gameJustStarted=false;},400);});
  document.getElementById('restartBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();stopBgMusic();gameOverOverlay.classList.add('hidden');initGame();startOverlay.classList.remove('hidden');});
  document.getElementById('nextBtn').addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();stopBgMusic();winOverlay.classList.add('hidden');level++;createBricks();paddle.x=(W-paddle.w)/2;resetBall();floatingTexts=[];updateUI();hideWordDisplay();gameRunning=true;startGameMusic();});

  initGame();gameLoop();
</script>
