.section-title span { color: var(--accent); }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.game-card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--text); transition: all 0.35s cubic-bezier(0.25,0.8,0.25,1.2); cursor: pointer; }

.game-card .card-preview { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 4em; position: relative; overflow: hidden; }

.game-card .card-tags { display: flex; gap: 8px; margin-bottom: 8px; }
.game-card .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,68,68,0.15); color: var(--accent); }
.game-card .tag.blue { background: rgba(100,149,237,0.15); color: #6495ed; }
.game-card p { color: var(--muted); font-size: 0.9em; line-height: 1.5; }
.game-card .card-arrow { position: absolute; bottom: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,68,68,0.1); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1.2em; transition: all 0.3s; }
.game-card:hover .card-arrow { background: var(--accent); color: #fff; }
footer { text-align: center; padding: 30px 20px; color: #444; font-size: 0.85em; border-top: 1px solid var(--border); }
footer a { color: var(--accent); text-decoration: none; }
@media (max-width: 600px) { header { padding: 35px 16px 20px; } header .logo { font-size: 2.4em; } .games { grid-template-columns: 1fr; gap: 16px; } .game-card .card-preview { height: 130px; font-size: 3em; } }
</style>
